# yolotown targeting itself (the self-hosting bootstrap).
TEST_CMD="./test.sh"
PUSH_ON_GREEN="true"

# Conflict detection reads this inventory. The default extension list would
# miss this repo's extensionless files — the `yolotown` entrypoint and the test
# shims are source, and a plan that cannot see them is a plan that cannot
# bucket a task touching them.
SOURCE_GLOBS="yolotown *.sh *.md tasks.txt tests/fake-claude tests/fake-gh"
